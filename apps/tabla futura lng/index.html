<div id="status-indicator" class="status-online">
    <span id="status-dot"></span>
    <span id="status-text">Online / Conectado al servidor</span>
</div>

<style>
    #status-indicator {
        position: fixed;
        bottom: 20px;
        left: 20px;
        padding: 8px 15px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 50px;
        display: flex;
        align-items: center;
        font-family: sans-serif;
        font-size: 12px;
        z-index: 9999;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
    }

    #status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 10px;
        box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* Estados */
    .status-online { color: #40ff40; border-color: #40ff40 !important; }
    .status-online #status-dot { background-color: #40ff40; box-shadow: 0 0 10px #40ff40; }

    .status-offline { color: #ff4040; border-color: #ff4040 !important; }
    .status-offline #status-dot { background-color: #ff4040; box-shadow: 0 0 10px #ff4040; }
</style>

<script>
    const indicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');

    function updateStatus() {
        if (navigator.onLine) {
            indicator.className = 'status-online';
            statusText.innerText = 'Online / Conectado al servidor';
        } else {
            indicator.className = 'status-offline';
            statusText.innerText = 'Offline / Sin conexión a internet';
        }
    }

    // Escuchar cambios de red
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Ejecutar al cargar la página
    updateStatus();
</script>
