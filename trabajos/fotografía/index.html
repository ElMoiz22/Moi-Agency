  <div id="header"></div>

  <script>
    fetch("https://moidg.online/header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
      const hamburger = document.querySelector(".hamburger");
      const navMenu = document.querySelector(".nav-menu");
      const subMenuParents = document.querySelectorAll(".has-submenu > .nav-link");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navMenu.classList.toggle("active");
      });

      subMenuParents.forEach(span => {
        span.addEventListener("click", function(e){
          if(window.innerWidth <= 1200){
            e.preventDefault();
            const parentLi = this.parentElement;
            subMenuParents.forEach(other => {
              if(other != this){
                other.parentElement.classList.remove("open");
              }
            });
            parentLi.classList.toggle("open");
          }
        });
      });

      document.querySelectorAll(".submenu a").forEach(link=>{
        link.addEventListener("click",function(){
          if(window.innerWidth <=1200){
            hamburger.classList.remove("active");
            navMenu.classList.remove("active");
            subMenuParents.forEach(span=>span.parentElement.classList.remove("open"));
          }
        });
      });
    });
  </script>

  <!-- Inicialización individual manteniendo la estructura principal -->
<script>
  document.querySelectorAll('.mySwiper').forEach((element, index) => {
    
    // Incrementa 800ms por cada galería empezando desde 3000ms
    const customDelay = 5000 + (index * 800);

    new Swiper(element, {
      effect: 'cards',
      grabCursor: true,
      loop: true,
      autoplay: {
        delay: customDelay,
        disableOnInteraction: false,
      },
    });
  });
</script>
