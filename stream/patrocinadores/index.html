<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <title>Slider Responsivo PD</title>
    <style>
:root {
    --swiper-theme-color: #007aff
}
:host {
    position: relative;
    display: block;
    margin-left: auto;
    margin-right: auto;
    z-index: 1
}
.swiper {
    margin-left: auto;
    margin-right: auto;
    position: relative;
    overflow: hidden;
    list-style: none;
    padding: 0;
    z-index: 1;
    display: block
}
.swiper-vertical>.swiper-wrapper {
    flex-direction: column
}
.swiper-wrapper {
    position: relative;
    max-width: 100%;
    height: 100%;
    z-index: 1;
    display: flex;
    transition-property: transform;
    transition-timing-function: var(--swiper-wrapper-transition-timing-function, initial);
    box-sizing: content-box
}
    </style>
</head>
<body>

            <div class="swiper mySwiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (3).png"  style="cursor: pointer;" onclick="mostrarContenido(2)"/></div>
        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (7).png" style="cursor: pointer;" onclick="mostrarContenido(3)"/></div>
        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (6).png" style="cursor: pointer;" onclick="mostrarContenido(2)"/></div>

        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (8).png"  style="cursor: pointer;" onclick="mostrarContenido(2)"/></div>
        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (2).png"  style="cursor: pointer;" onclick="mostrarContenido(2)"/></div>
        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (1).png"  style="cursor: pointer;" onclick="mostrarContenido(2)"/></div>

        <div class="swiper-slide"><img style="width: 100%;" src="patrocinadores cintillos/p (4).png"  style="cursor: pointer;" onclick="mostrarContenido(2)"/></div>
    </div>
  </div>


    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
  var swiper = new Swiper(".mySwiper", {
    effect: "fade", // 👈 CAMBIO PRINCIPAL
    fadeEffect: {
      crossFade: true
    },
    slidesPerView: 1,
    spaceBetween: 60,
    loop: true,
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    autoplay: {
      delay: 15500,
      disableOnInteraction: false,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
  });
</script>

</body>
</html>
