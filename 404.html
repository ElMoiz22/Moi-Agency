<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Error 404 Moi Agency</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8912829457952801"
     crossorigin="anonymous"></script>
     <link rel="icon" class="icono" href="icons/web logo.ico" type="icono">
<link rel="stylesheet" href="https://moidg.online/styles.css" />
<link rel="stylesheet" href="https://moidg.online/headerstyles.css" />
<link rel="stylesheet" href="https://moidg.online/swipe.css" />
<link rel="stylesheet" href="https://use.typekit.net/juf6vww.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
	
<div id="header"></div>

<script>
fetch("https://moidg.online/header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    const hamburger = document.querySelector(".hamburger");
    const navMenu = document.querySelector(".nav-menu");
    const subMenuParents = document.querySelectorAll(".has-submenu > .nav-link");

    // Toggle menú principal
    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      navMenu.classList.toggle("active");
    });

    // Submenús en móviles: solo uno abierto a la vez
    subMenuParents.forEach(span => {
      span.addEventListener("click", function (e) {
        if (window.innerWidth <= 1200) {
          e.preventDefault(); // evita que haga scroll o busque un link
          const parentLi = this.parentElement;

          // Cierra otros submenús abiertos
          subMenuParents.forEach(other => {
            if (other !== this) {
              other.parentElement.classList.remove("open");
            }
          });

          // Alterna el submenú del click actual
          parentLi.classList.toggle("open");
        }
      });
    });

    // Cerrar menú en móvil al hacer click en enlaces normales del submenu
    document.querySelectorAll(".submenu a").forEach(link => {
      link.addEventListener("click", function () {
        if (window.innerWidth <= 1200) {
          hamburger.classList.remove("active");
          navMenu.classList.remove("active");

          // Cierra todos los submenús
          subMenuParents.forEach(span => span.parentElement.classList.remove("open"));
        }
      });
    });
  });
</script>

<style>
        /* Contenedor principal */
        .PD-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            font-family: sans-serif;
            text-align: center;
        }

        /* La magia de la responsividad */
        .PD-responsive-img {
            max-width: 100%; /* No permite que la imagen sea más grande que su padre */
            height: auto;    /* Mantiene la proporción original */
            display: block;  /* Elimina espacios en blanco extra bajo la imagen */
            margin: 0 auto;  /* Centra la imagen */
            border-radius: 8px; /* Opcional: bordes redondeados */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .PD-caption {
            margin-top: 10px;
            color: #555;
            font-style: italic;
        }
    </style>

<div class="PD-container">

    </div>


<script src="https://moidg.online/script.js"></script>
