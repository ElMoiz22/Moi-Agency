<style>
.txttitulopost {
  color: #00526f;
}
  .post {
      display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 12px;
  padding: 10px;
  }

  img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;  /* opcional */
  object-fit: cover;  }

#previewOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;              /* oculto al inicio */
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Imagen en grande */
#previewOverlay img {
  max-width: 50%;
  max-height: 100%;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* Botón de cerrar */
#previewOverlay span {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: #fff;
  cursor: pointer;
}

.separator {
  background-color: #00526f0f;
  border-radius: 21px;
}

</style>
<body>
	
<div id="header"></div>

<script>
fetch("https://moidg.online/header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    const hamburger = document.querySelector(".hamburger");
    const navMenu = document.querySelector(".nav-menu");
    const subMenuParents = document.querySelectorAll(".has-submenu > .nav-link");

    // Toggle menú principal
    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      navMenu.classList.toggle("active");
    });

    // Submenús en móviles: solo uno abierto a la vez
    subMenuParents.forEach(span => {
      span.addEventListener("click", function (e) {
        if (window.innerWidth <= 1200) {
          e.preventDefault(); // evita que haga scroll o busque un link
          const parentLi = this.parentElement;

          // Cierra otros submenús abiertos
          subMenuParents.forEach(other => {
            if (other !== this) {
              other.parentElement.classList.remove("open");
            }
          });

          // Alterna el submenú del click actual
          parentLi.classList.toggle("open");
        }
      });
    });

    // Cerrar menú en móvil al hacer click en enlaces normales del submenu
    document.querySelectorAll(".submenu a").forEach(link => {
      link.addEventListener("click", function () {
        if (window.innerWidth <= 1200) {
          hamburger.classList.remove("active");
          navMenu.classList.remove("active");

          // Cierra todos los submenús
          subMenuParents.forEach(span => span.parentElement.classList.remove("open"));
        }
      });
    });
  });
</script>

  <script>
// Selecciona todas las imágenes PNG
const images = document.querySelectorAll('img[src$=".png"]');
const overlay = document.getElementById('previewOverlay');
const previewImage = document.getElementById('previewImage');
const closeBtn = overlay.querySelector('span');

// Al hacer click en cualquier imagen PNG
images.forEach(img => {
  img.addEventListener('click', e => {
    e.preventDefault(); // evita que se comporte como enlace
    previewImage.src = img.src; // muestra la misma imagen
    overlay.style.display = 'flex';
  });
});

// Cerrar al hacer click en la X
closeBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
});

// Cerrar al hacer click fuera de la imagen
overlay.addEventListener('click', e => {
  if (e.target === overlay) {
    overlay.style.display = 'none';
  }
});
</script>
